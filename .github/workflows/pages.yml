name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The pages describe gonogo's source, so the check compiles the template
      # against it and verifies the ui-kit export snapshot against it. A change
      # to the kit on staging that a page contradicts turns this job red.
      - uses: actions/checkout@v4
        with:
          repository: ksp-gonogo/gonogo
          ref: staging
          path: gonogo
          sparse-checkout: |
            packages/ui-kit
            packages/theme
            mod/sitrep-sdk
            mod/Sitrep.Contract
            mod/Directory.Build.props
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Sitrep.Contract references no KSP assembly, so it builds here, and the
      # mod snippets compile against the same contract the mod ships.
      - run: dotnet build gonogo/mod/Sitrep.Contract/Sitrep.Contract.csproj -c Release -f net472 -o "$RUNNER_TEMP/contract" --nologo -v q
      - run: npm run check
        env:
          GONOGO_REPO: ${{ github.workspace }}/gonogo
          SITREP_CONTRACT_DLL: ${{ runner.temp }}/contract/Sitrep.Contract.dll
      - run: npx vitepress build docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
